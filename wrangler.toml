name = "alaki-pelaki"
main = "src/index.js"
compatibility_date = "2026-10-22"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "alaki-pelaki-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[vars]
APP_NAME = "الکی‌پلکی"
APP_ENV = "production"
